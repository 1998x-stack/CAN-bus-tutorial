<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 276"><title id="title">Boot-up 与心跳时间轴</title><desc id="desc">同一个 0x705 ID 上，00 代表 Boot-up，7F/05 是状态；消费者用本地监控计时而非凭一个超时就判硬件损坏。</desc><rect width="900" height="276" fill="#fffdf9"/><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253e40} .label{font-weight:700;font-size:19px}.small{font-size:15px}.tiny{font-size:13px}.arrow{stroke:#647e7b;stroke-width:2.4;fill:none;marker-end:url(#tip)} .teal{fill:#e1f3ec;stroke:#168377} .peach{fill:#fff0e4;stroke:#d27b54} .violet{fill:#f0eafb;stroke:#8267b3} .gray{fill:#f1f5f3;stroke:#849d9b} .box{stroke-width:2;rx:13} </style><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#647e7b"/></marker></defs>
<text class="label" x="26" y="47">节点 5 → 监控器</text>
<line x1="47" y1="126" x2="850" y2="126" stroke="#aac1b9" stroke-width="3"/>
<path d="M150 106V145" stroke="#147f80" stroke-width="3"/><rect x="90" y="61" width="120" height="40" rx="9" fill="#f0eafb"/><text x="150" y="87" text-anchor="middle" class="small">0x705 / 00</text><path d="M325 106V145" stroke="#147f80" stroke-width="3"/><rect x="265" y="61" width="120" height="40" rx="9" fill="#e0f2ec"/><text x="325" y="87" text-anchor="middle" class="small">0x705 / 7F</text><path d="M500 106V145" stroke="#147f80" stroke-width="3"/><rect x="440" y="61" width="120" height="40" rx="9" fill="#e0f2ec"/><text x="500" y="87" text-anchor="middle" class="small">0x705 / 05</text><path d="M675 106V145" stroke="#147f80" stroke-width="3"/><rect x="615" y="61" width="120" height="40" rx="9" fill="#e0f2ec"/><text x="675" y="87" text-anchor="middle" class="small">0x705 / 05</text>
<text class="tiny" x="150" y="164" text-anchor="middle">t0</text><text class="tiny" x="325" y="164" text-anchor="middle">t1</text><text class="tiny" x="500" y="164" text-anchor="middle">t2</text><text class="tiny" x="675" y="164" text-anchor="middle">t3</text>
<path class="arrow" d="M675 126H836"/><text class="small" x="755" y="99" text-anchor="middle">没有新心跳</text>
<rect x="680" y="190" width="194" height="57" rx="9" fill="#fff0e4" stroke="#d27b54"/><text class="small" x="777" y="213" text-anchor="middle">本地计时超过 Tconsumer</text><text class="small" x="777" y="233" text-anchor="middle">→ 通知应用层</text>
<rect x="48" y="194" width="560" height="52" rx="9" fill="#f0f7f2" stroke="#bfd8ca"/><text class="small" x="65" y="217">0x1017 = 生产周期；0x1016 = 监控 Node-ID + 超时</text><text class="small" x="65" y="238">00 为 Boot-up，不等同周期性心跳状态码</text>
</svg>