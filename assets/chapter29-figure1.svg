<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 245" role="img" aria-labelledby="c29-t1 c29-d1"><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.diagram-label{font-size:16px;fill:#213f48;font-weight:650}.diagram-note{font-size:12px;fill:#536a71}.diagram-title{font-size:19px;fill:#204b52;font-weight:700}</style><title id="c29-t1">CAN 低功耗节点电源域划分</title><desc id="c29-d1">MCU及其CAN控制器可以断时钟或低功耗；可保持供电的收发器局部唤醒逻辑监视总线，事件经中断和电源管理唤醒MCU。</desc><rect width="760" height="245" rx="14" fill="#f6f8f4"/>
<text x="22" y="34" class="diagram-title">电源域：谁仍有电，谁才能识别唤醒</text>
<rect x="25" y="68" width="196" height="117" rx="14" fill="#e6eee8" stroke="#88a99f" stroke-width="2"/><text x="123" y="107" text-anchor="middle" class="diagram-label">MCU + CAN 控制器</text><text x="123" y="143" text-anchor="middle" class="diagram-note">可进入 Stop / Sleep</text>
<rect x="286" y="68" width="192" height="117" rx="14" fill="#e4f4f1" stroke="#087f82" stroke-width="2"/><text x="382" y="105" text-anchor="middle" class="diagram-label">CAN 收发器</text><text x="382" y="135" text-anchor="middle" class="diagram-note">低功耗监视逻辑</text><text x="382" y="154" text-anchor="middle" class="diagram-note">保持供电</text>
<rect x="542" y="79" width="192" height="95" rx="14" fill="#fceee4" stroke="#c76843" stroke-width="2"/><text x="638" y="122" text-anchor="middle" class="diagram-label">CAN_H / CAN_L</text><text x="638" y="147" text-anchor="middle" class="diagram-note">网络活动</text>
<path d="M542 126H480" stroke="#c76843" stroke-width="3"/><path d="M286 126H221" stroke="#087f82" stroke-width="3"/><path d="M230 119l-9 7 9 7 M489 119l-9 7 9 7" fill="none" stroke="#087f82" stroke-width="2"/>
<text x="252" y="101" text-anchor="middle" class="diagram-note">唤醒</text><text x="511" y="101" text-anchor="middle" class="diagram-note">监听</text><text x="382" y="212" text-anchor="middle" class="diagram-note">还需计入稳压器静态电流、上拉/下拉和漏电</text></svg>
