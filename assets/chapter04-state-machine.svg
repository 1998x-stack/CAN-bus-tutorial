<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 410" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">CAN TEC REC 计数决定错误主动被动与Bus-Off状态</title><desc id="svg-desc">TEC和REC均低于128时为错误主动；任一达到128且TEC未达到256则为错误被动；TEC达到256便为Bus-Off。计数恢复可使被动返回主动，Bus-Off恢复须观察128次11个连续隐性位并按控制器规定完成恢复。</desc><defs><marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#397c70"/></marker></defs><rect x="6" y="6" width="928" height="398" rx="15" fill="#fff" stroke="#d7e4e0" stroke-width="2"/><text x="22" y="40" font-size="23" font-weight="700" fill="#1e5852" text-anchor="start" font-family="Arial, 'Microsoft YaHei',sans-serif">CAN 故障限制状态机 · 不同门槛、不同职责</text><rect x="25" y="113" width="242" height="145" rx="12" fill="#e4f6ee" stroke="#95cabb" stroke-width="2"/><rect x="348" y="113" width="242" height="145" rx="12" fill="#fff3e2" stroke="#d9bc8f" stroke-width="2"/><rect x="673" y="113" width="242" height="145" rx="12" fill="#fdebe7" stroke="#dfb0a6" stroke-width="2"/><text x="146" y="158" font-size="22" font-weight="700" fill="#1c6b60" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">Error Active</text><text x="146" y="193" font-size="16" font-weight="500" fill="#3d625c" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">TEC &lt; 128</text><text x="146" y="217" font-size="16" font-weight="500" fill="#3d625c" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">REC &lt; 128</text><text x="469" y="158" font-size="22" font-weight="700" fill="#926031" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">Error Passive</text><text x="469" y="193" font-size="16" font-weight="500" fill="#805d39" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">TEC 或 REC ≥ 128</text><text x="469" y="217" font-size="16" font-weight="500" fill="#805d39" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">且 TEC &lt; 256</text><text x="794" y="158" font-size="22" font-weight="700" fill="#a64e46" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">Bus-Off</text><text x="794" y="193" font-size="18" font-weight="500" fill="#894f4b" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">TEC ≥ 256</text><text x="794" y="217" font-size="16" font-weight="500" fill="#9f6360" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">暂停总线参与</text><path d="M270 181H343" stroke="#397c70" stroke-width="3" marker-end="url(#arrow4)"/><path d="M594 181H668" stroke="#397c70" stroke-width="3" marker-end="url(#arrow4)"/><text x="306" y="89" font-size="15" font-weight="700" fill="#89632d" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">任一 ≥ 128</text><text x="636" y="89" font-size="15" font-weight="700" fill="#a64e46" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">TEC ≥ 256</text><path d="M468 263V311H147V263" stroke="#397c70" stroke-width="3" fill="none" marker-end="url(#arrow4)"/><text x="305" y="300" font-size="16" font-weight="600" fill="#34665e" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">TEC 和 REC 回到 ≤ 127</text><path d="M796 263V368H148V320" stroke="#397c70" stroke-width="3" fill="none" marker-end="url(#arrow4)"/><text x="485" y="358" font-size="16" font-weight="600" fill="#806044" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">128 次 × 11 连续隐性位；控制器允许恢复</text><text x="22" y="390" font-size="14" font-weight="500" fill="#607974" text-anchor="start" font-family="Arial, 'Microsoft YaHei',sans-serif">此图只表达状态判定，不以箭头模拟每种错误的计数增量。</text></svg>
