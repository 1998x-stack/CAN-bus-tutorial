<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 804 302" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">CAN 经典位填充示例</title><desc id="svg-desc">未填充序列为六个零后接一个一；总线位流在前五个零之后插入一个标橙色的逻辑一，所以成为五个零、一个填充的一、一个原始零、一个原始一。</desc><rect x="6" y="7" width="790" height="282" rx="10" fill="#fff" stroke="#d8e6e3" stroke-width="2"/><text x="24" y="40" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#194b4b" text-anchor="start" font-weight="700">连续 5 个相同逻辑位后，插入 1 个相反位</text><text x="24" y="102" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="19" fill="#2c5552" text-anchor="start" font-weight="700">未填充</text><rect x="213" y="70" width="61" height="62" rx="10" fill="#e5f2ef" stroke="#9fc8be" stroke-width="2"/><text x="243" y="111" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="27" fill="#23655c" text-anchor="middle" font-weight="700">0</text><rect x="282" y="70" width="61" height="62" rx="10" fill="#e5f2ef" stroke="#9fc8be" stroke-width="2"/><text x="312" y="111" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="27" fill="#23655c" text-anchor="middle" font-weight="700">0</text><rect x="351" y="70" width="61" height="62" rx="10" fill="#e5f2ef" stroke="#9fc8be" stroke-width="2"/><text x="381" y="111" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="27" fill="#23655c" text-anchor="middle" font-weight="700">0</text><rect x="420" y="70" width="61" height="62" rx="10" fill="#e5f2ef" stroke="#9fc8be" stroke-width="2"/><text x="450" y="111" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="27" fill="#23655c" text-anchor="middle" font-weight="700">0</text><rect x="489" y="70" width="61" height="62" rx="10" fill="#e5f2ef" stroke="#9fc8be" stroke-width="2"/><text x="519" y="111" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="27" fill="#23655c" text-anchor="middle" font-weight="700">0</text><rect x="558" y="70" width="61" height="62" rx="10" fill="#e5f2ef" stroke="#9fc8b