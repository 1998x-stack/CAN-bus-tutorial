, sans-serif" font-size="27" fill="#954b20" text-anchor="middle" font-weight="700">1</text><rect x="627" y="155" width="61" height="62" rx="10" fill="#e5f2ef" stroke="#9fc8be" stroke-width="2"/><text x="657" y="196" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="27" fill="#23655c" text-anchor="middle" font-weight="700">0</text><rect x="696" y="155" width="61" height="62" rx="10" fill="#e5f2ef" stroke="#9fc8be" stroke-width="2"/><text x="726" y="196" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="27" fill="#23655c" text-anchor="middle" font-weight="700">1</text><text x="623" y="248" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#a25d2c" text-anchor="middle" font-weight="700">↑ 插入的 1</text><text x="25" y="274" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#56706e" text-anchor="start" font-weight="500">示例仅展示一段位流；实际经典 CAN 的动态位填充范围见正文。</text></svg>
