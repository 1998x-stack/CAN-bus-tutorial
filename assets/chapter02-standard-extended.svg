<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 298" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">11 位标准帧与 29 位扩展帧在仲裁阶段的对比</title><desc id="svg-desc">标准数据帧前11位标识符之后是显性RTR0和显性IDE0；扩展数据帧在相同11位标识符后是隐性SRR1、隐性IDE1，再传18位扩展标识符和显性RTR0。绘图宽度非位数比例。</desc><rect x="6" y="10" width="938" height="277" rx="10" fill="#fff" stroke="#d8e6e3" stroke-width="2"/><text x="27" y="47" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" fill="#194b4b" text-anchor="start" font-weight="700">相同的前 11 位标识符，谁先占用总线？</text><text x="28" y="122" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#255a57" text-anchor="start" font-weight="700">标准数据帧</text><rect x="170" y="86" width="195" height="66" rx="10" fill="#daf0ed" stroke="#94b9b3" stroke-width="2"/><text x="267.5" y="113" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#234e4c" text-anchor="middle" font-weight="700">Base ID</text><text x="267.5" y="136" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#4d6767" text-anchor="middle" font-weight="500">11 位</text><rect x="373" y="86" width="140" height="66" rx="10" fill="#e3f4e8" stroke="#94b9b3" stroke-width="2"/><text x="443" y="113" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#234e4c" text-anchor="middle" font-weight="700">RTR = 0</text><text x="443" y="136" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#4d6767" text-anchor="middle" font-weight="500">显性</text><rect x="521" y="86" width="140" height="66" rx="10" fill="#e3f4e8" stroke="#94b9b3" stroke-width="2"/><text x="591" y="113" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#234e4c" text-anchor="middle" font-weight="700">IDE = 0</text><text x="591" y="136" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#4d6767" text-anchor="middle" font-weight="500">显性</text><text x="28" y="225" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" fill="#255a57" text-anchor="start" font-weight="700">扩展数据帧</text><rect x="170" y="189" width="195" height="66" rx="10" fill="#daf0ed" stroke="#94b9b3" stroke-width="2"/><text x="267.5" y="216" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#234e4c" text-anchor="middle" font-weight="700">Base ID</text><text x="267.5" y="239" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#4d6767" text-anchor="middle" font-weight="500">11 位</text><rect x="373" y="189" width="104" height="66" rx="10" fill="#fff1df" stroke="#94b9b3" stroke-width="2"/><text x="425" y="216" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#234e4c" text-anchor="middle" font-weight="700">SRR = 1</text><text x="425" y="239" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#4d6767" text-anchor="middle" font-weight="500">隐性</text><rect x="485" y="189" width="104" height="66" rx="10" fill="#fff1df" stroke="#94b9b3" stroke-width="2"/><text x="537" y="216" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#234e4c" text-anchor="middle" font-weight="700">IDE = 1</text><text x="537" y="239" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#4d6767" text-anchor="middle" font-weight="500">隐性</text><rect x="597" y="189" width="135" height="66" rx="10" fill="#e3eafb" stroke="#94b9b3" stroke-width="2"/><text x="664.5" y="216" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#234e4c" text-anchor="middle" font-weight="700">扩展 ID</text><text x="664.5" y="239" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#4d6767" text-anchor="middle" font-weight="500">18 位</text><rect x="740" y="189" width="100" height="66" rx="10" fill="#e3f4e8" stroke="#94b9b3" stroke-width="2"/><text x="790" y="216" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#234e4c" text-anchor="middle" font-weight="700">RTR = 0</text><text x="790" y="239" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" fill="#4d6767" text-anchor="middle" font-weight="500">显性</text><text x="27" y="281" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#576d6b" text-anchor="start" font-weight="500">同前缀的标准数据帧先在 RTR(0) / SRR(1) 处赢得仲裁；图中只画相关前缀。</text></svg>
