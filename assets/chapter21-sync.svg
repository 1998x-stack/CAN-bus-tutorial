<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 320"><title id="title">SYNC 对同步 PDO 的节拍作用</title><desc id="desc">SYNC 为逻辑同步基准，多个 TPDO 仍须逐帧仲裁发送；RPDO 的应用时机由配置约定，SYNC 不等于同一物理瞬间完成总线传输。</desc><rect width="900" height="320" fill="#fffdf9"/><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253e40} .label{font-weight:700;font-size:19px}.small{font-size:15px}.tiny{font-size:13px}.arrow{stroke:#647e7b;stroke-width:2.4;fill:none;marker-end:url(#tip)} .teal{fill:#e1f3ec;stroke:#168377} .peach{fill:#fff0e4;stroke:#d27b54} .violet{fill:#f0eafb;stroke:#8267b3} .gray{fill:#f1f5f3;stroke:#849d9b} .box{stroke-width:2;rx:13} </style><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#647e7b"/></marker></defs>
<text class="label" x="25" y="44">时间 →</text>
<line x1="105" y1="90" x2="850" y2="90" stroke="#8eb9a5" stroke-width="2"/>
<path d="M180 68V260" stroke="#147f80" stroke-dasharray="5 7" stroke-width="2"/><rect x="131" y="69" width="98" height="35" rx="8" fill="#dff3ec"/><text class="small" x="180" y="93" text-anchor="middle">SYNC #1</text><path d="M480 68V260" stroke="#147f80" stroke-dasharray="5 7" stroke-width="2"/><rect x="431" y="69" width="98" height="35" rx="8" fill="#dff3ec"/><text class="small" x="480" y="93" text-anchor="middle">SYNC #2</text><path d="M780 68V260" stroke="#147f80" stroke-dasharray="5 7" stroke-width="2"/><rect x="731" y="69" width="98" height="35" rx="8" fill="#dff3ec"/><text class="small" x="780" y="93" text-anchor="middle">SYNC #3</text>
<text class="small" x="28" y="154">TPDO</text><text class="small" x="28" y="232">RPDO</text>
<rect x="200" y="126" width="107" height="47" rx="8" fill="#f0eafb" stroke="#8267b3"/><text class="small" x="254" y="155" text-anchor="middle">节点 A</text>
<rect x="316" y="126" width="107" height="47" rx="8" fill="#f0eafb" stroke="#8267b3"/><text class="small" x="369" y="155" text-anchor="middle">节点 B</text>
<rect x="498" y="126" width="108" height="47" rx="8" fill="#f0eafb" stroke="#8267b3"/><text class="small" x="552" y="155" text-anchor="middle">节点 A</text>
<rect x="610" y="126" width="108" height="47" rx="8" fill="#f0eafb" stroke="#8267b3"/><text class="small" x="664" y="155" text-anchor="middle">节点 B</text>
<rect x="154" y="200" width="302" height="51" rx="8" fill="#fff0e4" stroke="#d27b54"/><text class="small" x="305" y="221" text-anchor="middle">先到的 RPDO 缓存输入</text><text class="tiny" x="305" y="241" text-anchor="middle">由接收端在同步点应用（设备配置）</text>
<text x="25" y="296" class="small">逻辑上同节拍 ≠ 帧都在同一时刻上总线；必须考虑仲裁、抖动和设备调度。</text>
</svg>