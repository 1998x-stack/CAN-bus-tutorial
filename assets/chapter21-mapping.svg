<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 320"><title id="title">TPDO1 映射的 64 位布局</title><desc id="desc">两条 32 位映射条目，速度实际值 606C:00 占低 4 字节，位置实际值 6064:00 占高 4 字节，总计 64 位。</desc><rect width="900" height="320" fill="#fffdf9"/><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253e40} .label{font-weight:700;font-size:19px}.small{font-size:15px}.tiny{font-size:13px}.arrow{stroke:#647e7b;stroke-width:2.4;fill:none;marker-end:url(#tip)} .teal{fill:#e1f3ec;stroke:#168377} .peach{fill:#fff0e4;stroke:#d27b54} .violet{fill:#f0eafb;stroke:#8267b3} .gray{fill:#f1f5f3;stroke:#849d9b} .box{stroke-width:2;rx:13} </style><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#647e7b"/></marker></defs>
<text class="label" x="28" y="42">对象字典映射条目</text>
<rect class="box teal" x="29" y="75" width="410" height="80"/><text class="label" x="235" y="108" text-anchor="middle">0x606C0020</text><text class="small" x="235" y="137" text-anchor="middle">速度实际值 · 32 bit</text>
<rect class="box violet" x="461" y="75" width="410" height="80"/><text class="label" x="667" y="108" text-anchor="middle">0x60640020</text><text class="small" x="667" y="137" text-anchor="middle">位置实际值 · 32 bit</text>
<path class="arrow" d="M235 156V205"/><path class="arrow" d="M667 156V205"/>
<rect x="29" y="212" width="99" height="52" fill="#e1f3ec" stroke="#91aaa5"/><text class="small" x="78" y="234" text-anchor="middle">Byte 0</text><text class="tiny" x="78" y="253" text-anchor="middle">speed</text><rect x="134" y="212" width="99" height="52" fill="#e1f3ec" stroke="#91aaa5"/><text class="small" x="183" y="234" text-anchor="middle">Byte 1</text><text class="tiny" x="183" y="253" text-anchor="middle">speed</text><rect x="239" y="212" width="99" height="52" fill="#e1f3ec" stroke="#91aaa5"/><text class="small" x="288" y="234" text-anchor="middle">Byte 2</text><text class="tiny" x="288" y="253" text-anchor="middle">speed</text><rect x="344" y="212" width="99" height="52" fill="#e1f3ec" stroke="#91aaa5"/><text class="small" x="393" y="234" text-anchor="middle">Byte 3</text><text class="tiny" x="393" y="253" text-anchor="middle">speed</text><rect x="449" y="212" width="99" height="52" fill="#f0eafb" stroke="#91aaa5"/><text class="small" x="498" y="234" text-anchor="middle">Byte 4</text><text class="tiny" x="498" y="253" text-anchor="middle">position</text><rect x="554" y="212" width="99" height="52" fill="#f0eafb" stroke="#91aaa5"/><text class="small" x="603" y="234" text-anchor="middle">Byte 5</text><text class="tiny" x="603" y="253" text-anchor="middle">position</text><rect x="659" y="212" width="99" height="52" fill="#f0eafb" stroke="#91aaa5"/><text class="small" x="708" y="234" text-anchor="middle">Byte 6</text><text class="tiny" x="708" y="253" text-anchor="middle">position</text><rect x="764" y="212" width="99" height="52" fill="#f0eafb" stroke="#91aaa5"/><text class="small" x="813" y="234" text-anchor="middle">Byte 7</text><text class="tiny" x="813" y="253" text-anchor="middle">position</text>
<text x="32" y="294" class="small">总映射 64 bit = 8 Byte，具体字节值按小端编码；对象必须支持 PDO 映射。</text>
</svg>