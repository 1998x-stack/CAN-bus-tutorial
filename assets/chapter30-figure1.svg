<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="c30-t1 c30-d1" viewBox="0 0 760 250"><style>text{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.diagram-label{font-size:16px;fill:#213f48;font-weight:650}.diagram-note{font-size:12px;fill:#536a71}.diagram-title{font-size:19px;fill:#204b52;font-weight:700}</style><title id="c30-t1">STM32采集到上位机的数据链</title><desc id="c30-d1">从传感器与ADC，经过STM32帧编码，收发器接入共享CAN总线，再经过USB-CAN适配器到PC接收解码与诊断。</desc><rect width="760" height="250" rx="14" fill="#f6f8f4"/><text x="22" y="33" class="diagram-title">把每个接口都变成可验证的契约</text>
