<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-labelledby="t d"><title id="t">bxCAN时序采样点</title><desc id="d">同步段1tq、BS1 14tq、BS2 3tq，采样点位于前15tq后</desc><rect x="0" y="0" width="960" height="260" rx="18" fill="#f7fbf9"/><g font-family="system-ui,'PingFang SC',sans-serif" fill="#214343"><text x="35" y="43" font-size="19" font-weight="720">一个 CAN 位 = 18 tq（PCLK1 36MHz, BRP 4）</text><rect x="35" y="85" width="50" height="88" fill="#7860b5"/><rect x="85" y="85" width="700" height="88" fill="#2c9185"/><rect x="785" y="85" width="150" height="88" fill="#e2a364"/><text x="60" y="117" font-size="15" fill="white" text-anchor="middle">1</text><text x="60" y="140" font-size="13" fill="white" text-anchor="middle">SYNC</text><text x="435" y="135" font-size="24" fill="white" text-anchor="middle">BS1 = 14 tq</text><text x="860" y="135" font-size="18" fill="#55341c" text-anchor="middle">BS2 = 3 tq</text><path d="M785 69V192" stroke="#7c4caf" stroke-width="3" stroke-dasharray="5 5"/><text x="785" y="61" font-size="16" text-anchor="middle">采样点 15/18 = 83.33%</text><text x="480" y="228" text-anchor="middle" font-size="18">36 MHz ÷ (4 × 18) = 500 kbit/s</text></g></svg>
