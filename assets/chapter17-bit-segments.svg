<svg viewBox="0 0 742 236" role="img" aria-labelledby="c17tq-t c17tq-d" xmlns="http://www.w3.org/2000/svg">
      <title id="c17tq-t">500 kbit/s 例子中 18 个时间量子的组成</title>
      <desc id="c17tq-d">36 MHz 外设时钟、BRP 为 4；1 TQ 同步段、14 TQ BS1、3 TQ BS2，共 18 TQ，采样点为 15 除以 18，约 83.33%。</desc>
      <g font-family="sans-serif" font-size="16" fill="#284544"><text x="35" y="28" font-weight="700">一个名义位 = 18 TQ = 2 μs</text></g>
      <rect x="35" y="65" width="34" height="78" fill="#745ab7" rx="3"/>
      <rect x="69" y="65" width="476" height="78" fill="#147f80"/>
      <rect x="545" y="65" width="102" height="78" fill="#cf6c4d" rx="3"/>
      <path d="M545 45V183" stroke="#253b3f" stroke-width="2.5" stroke-dasharray="6 5"/>
      <g font-family="sans-serif" font-size="15" text-anchor="middle"><text x="52" y="111" fill="white" font-weight="700">1</text><text x="307" y="105" fill="white" font-weight="700">BS1 = 14 TQ</text><text x="307" y="127" fill="white">传播 + 相位 1</text><text x="596" y="105" fill="white" font-weight="700">BS2</text><text x="596" y="126" fill="white">3 TQ</text><text x="546" y="207" fill="#243e42" font-weight="700">采样点 83.33%</text></g>
      <text x="35" y="172" fill="#66589e" font-size="14" font-family="sans-serif">Sync</text>
    </svg>
