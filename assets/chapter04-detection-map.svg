<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">CAN 五种错误检测通向错误标志和错误计数</title><desc id="svg-desc">五个检测入口分别是位检查、填充检查、CRC检查、格式检查与ACK检查；发现异常后，节点发送与自身状态对应的错误标志，错误计数按协议规则更新。</desc><defs><marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#397c70"/></marker></defs><rect x="7" y="7" width="946" height="386" rx="16" fill="#ffffff" stroke="#d1e4df" stroke-width="2"/><text x="30" y="46" font-size="24" font-weight="700" fill="#184f4b" text-anchor="start" font-family="Arial, 'Microsoft YaHei',sans-serif">报文中不同位置 → 不同的错误检测条件</text><rect x="30" y="83" width="166" height="89" rx="12" fill="#e6f4f0" stroke="#a5cbc0" stroke-width="2"/><text x="113" y="118" font-size="21" font-weight="700" fill="#175e57" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">Bit</text><text x="113" y="149" font-size="17" font-weight="500" fill="#50716b" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">发送与回读</text><path d="M113 173L113 199" fill="none" stroke="#35766d" stroke-width="3" stroke-linecap="round"/><rect x="215" y="83" width="166" height="89" rx="12" fill="#e6f4f0" stroke="#a5cbc0" stroke-width="2"/><text x="298" y="118" font-size="21" font-weight="700" fill="#175e57" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">Stuff</text><text x="298" y="149" font-size="17" font-weight="500" fill="#50716b" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">动态位填充</text><path d="M298 173L298 199" fill="none" stroke="#35766d" stroke-width="3" stroke-linecap="round"/><rect x="400" y="83" width="166" height="89" rx="12" fill="#e6f4f0" stroke="#a5cbc0" stroke-width="2"/><text x="483" y="118" font-size="21" font-weight="700" fill="#175e57" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">CRC</text><text x="483" y="149" font-size="17" font-weight="500" fill="#50716b" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">校验序列</text><path d="M483 173L483 199" fill="none" stroke="#35766d" stroke-width="3" stroke-linecap="round"/><rect x="585" y="83" width="166" height="89" rx="12" fill="#e6f4f0" stroke="#a5cbc0" stroke-width="2"/><text x="668" y="118" font-size="21" font-weight="700" fill="#175e57" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">Form</text><text x="668" y="149" font-size="17" font-weight="500" fill="#50716b" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">固定格式字段</text><path d="M668 173L668 199" fill="none" stroke="#35766d" stroke-width="3" stroke-linecap="round"/><rect x="770" y="83" width="166" height="89" rx="12" fill="#fff2e3" stroke="#e9c49a" stroke-width="2"/><text x="853" y="118" font-size="21" font-weight="700" fill="#175e57" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">ACK</text><text x="853" y="149" font-size="17" font-weight="500" fill="#50716b" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">无显性应答</text><path d="M853 173L853 199" fill="none" stroke="#35766d" stroke-width="3" stroke-linecap="round"/><path d="M113 199L853 199" fill="none" stroke="#35766d" stroke-width="3" stroke-linecap="round"/><path d="M483 199L483 227" fill="none" stroke="#397c70" stroke-width="3" marker-end="url(#arrow4)"/><rect x="319" y="231" width="330" height="65" rx="12" fill="#f0f5fc" stroke="#b5ced9" stroke-width="2"/><text x="484" y="258" font-size="19" font-weight="700" fill="#28566b" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">控制器发现协议条件异常</text><text x="484" y="284" font-size="15" font-weight="500" fill="#526f7c" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">根据错误状态确定如何发信号</text><path d="M483 297L483 318" stroke="#397c70" stroke-width="3" marker-end="url(#arrow4)"/><rect x="150" y="324" width="294" height="54" rx="12" fill="#ecf8f5" stroke="#abcfc4" stroke-width="2"/><text x="297" y="358" font-size="19" font-weight="700" fill="#21645d" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">主动 / 被动错误标志</text><rect x="525" y="324" width="294" height="54" rx="12" fill="#fff5e9" stroke="#dcc4a3" stroke-width="2"/><text x="672" y="358" font-size="19" font-weight="700" fill="#865a2d" text-anchor="middle" font-family="Arial, 'Microsoft YaHei',sans-serif">TEC / REC 限制故障</text><path d="M483 315L296 315" fill="none" stroke="#35766d" stroke-width="3" stroke-linecap="round"/><path d="M483 315L672 315" fill="none" stroke="#35766d" stroke-width="3" stroke-linecap="round"/></svg>
