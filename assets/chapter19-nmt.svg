<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 305"><title id="title">NMT 状态机</title><desc id="desc">节点初始化后发 Boot-up 并进入预操作；启动命令进入操作态；停止和复位命令改变状态。</desc><rect width="900" height="305" fill="#fffdf9"/><style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#253e40} .label{font-weight:700;font-size:19px}.small{font-size:15px}.tiny{font-size:13px}.arrow{stroke:#647e7b;stroke-width:2.4;fill:none;marker-end:url(#tip)} .teal{fill:#e1f3ec;stroke:#168377} .peach{fill:#fff0e4;stroke:#d27b54} .violet{fill:#f0eafb;stroke:#8267b3} .gray{fill:#f1f5f3;stroke:#849d9b} .box{stroke-width:2;rx:13} </style><defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#647e7b"/></marker></defs>
<rect class="box gray" x="23" y="89" width="179" height="101"/><text class="label" x="112" y="130" text-anchor="middle">初始化</text><text class="small" x="112" y="158" text-anchor="middle">上电 / Reset</text>
<rect class="box violet" x="269" y="89" width="173" height="101"/><text class="label" x="355" y="132" text-anchor="middle">预操作</text><text class="small" x="355" y="158" text-anchor="middle">SDO 可用</text>
<rect class="box teal" x="507" y="89" width="173" height="101"/><text class="label" x="594" y="132" text-anchor="middle">操作</text><text class="small" x="594" y="158" text-anchor="middle">PDO 可用</text>
<rect class="box peach" x="747" y="89" width="130" height="101"/><text class="label" x="812" y="132" text-anchor="middle">停止</text><text class="small" x="812" y="158" text-anchor="middle">无 SDO/PDO</text>
<path class="arrow" d="M202 139H266"/><text class="tiny" x="234" y="105" text-anchor="middle">Boot-up</text>
<path class="arrow" d="M442 119H503"/><text class="tiny" x="473" y="101" text-anchor="middle">01h</text>
<path class="arrow" d="M507 167H445"/><text class="tiny" x="474" y="196" text-anchor="middle">80h</text>
<path class="arrow" d="M680 139H743"/><text class="tiny" x="713" y="106" text-anchor="middle">02h</text>
<path class="arrow" d="M747 177Q675 244 442 178"/><text class="tiny" x="651" y="243">80h：回预操作</text>
<path class="arrow" d="M810 89Q790 27 594 27Q355 27 355 86"/><text class="tiny" x="586" y="17" text-anchor="middle">停止态也可收到 80h</text>
<text x="24" y="273" class="small">81h：Reset node；82h：Reset communication → 重新初始化通信并再次 Boot-up</text>
</svg>