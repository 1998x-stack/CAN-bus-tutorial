<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">显性与隐性的仲裁规则</title><desc id="svg-desc">发送器A输出显性0而发送器B输出隐性1，总线为显性0；输家B在合法仲裁位置发现不匹配并退出。</desc><rect x="9" y="9" width="822" height="282" rx="14" fill="#fbfdfb" stroke="#d4e3e0" stroke-width="2"/><text x="30" y="44" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#1e5651" text-anchor="start">同一位时间内，两台发送器共享 CAN 总线</text><rect x="45" y="82" width="206" height="102" rx="9" fill="#e6f6f0" stroke="#9ccaba" stroke-width="2"/><rect x="315" y="82" width="210" height="102" rx="9" fill="#fff3e8" stroke="#ecc398" stroke-width="2"/><rect x="588" y="82" width="204" height="102" rx="9" fill="#d9ece9" stroke="#99c6bd" stroke-width="2"/><text x="148" y="112" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#1a685f" text-anchor="middle">节点 A</text><text x="148" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#086f66" text-anchor="middle">发送显性 0</text><text x="419" y="112" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#915828" text-anchor="middle">节点 B</text><text x="419" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#ac652b" text-anchor="middle">发送隐性 1</text><text x="690" y="112" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="21" font-weight="700" fill="#1a5956" text-anchor="middle">公共总线</text><text x="690" y="151" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#0b706a" text-anchor="middle">实际读到 0</text><path d="M148 184 V219 H690 V184" stroke="#0b8379" stroke-width="4" fill="none"/><path d="M419 184 V219" stroke="#cf8e4e" stroke-width="4" fill="none"/><text x="420" y="246" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="600" fill="#3a6260" text-anchor="middle">1 被 0 覆盖：B 在仲裁位退让，A 的帧继续</text><text x="420" y="277" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" font-weight="500" fill="#677e78" text-anchor="middle">教学示意：这不是用普通 CMOS 输出直接并联</text></svg>
