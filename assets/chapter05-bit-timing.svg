<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 310" role="img" aria-labelledby="title desc">
<title id="title">500 kbit/s、16 TQ 的经典 CAN 位时间</title>
<desc id="desc">同步段1 TQ，传播段示意5 TQ，相位段1示意8 TQ，相位段2为2 TQ；采样点在第14个时间量子末端，位置87.5%。bxCAN 将传播段和相位段1合并为BS1=13 TQ。</desc>
<rect width="1020" height="310" rx="18" fill="#fffdf9"/>
<g font-family="system-ui,'Microsoft YaHei',sans-serif" fill="#203035">
<text x="70" y="39" font-size="22" font-weight="700">一个标称位 = 16 个时间量子（TQ）</text>
<text x="70" y="64" font-size="15" fill="#52666b">示例：fCAN = 16 MHz，BRP = 2，1 TQ = 125 ns；位时长 2 μs</text>
<rect x="70" y="97" width="55" height="91" fill="#f2ddbb" stroke="#b88848"/>
<rect x="125" y="97" width="275" height="91" fill="#d9efec" stroke="#42978b"/>
<rect x="400" y="97" width="440" height="91" fill="#dce8f5" stroke="#688cba"/>
<rect x="840" y="97" width="110" height="91" fill="#ece2f6" stroke="#9174b9"/>
<g font-size="18" text-anchor="middle" font-weight="650">
<text x="97" y="138" font-size="12">SYNC</text>
<text x="262" y="137">PROP_SEG</text><text x="262" y="162" font-size="14">5 TQ（示例拆分）</text>
<text x="620" y="137">PHASE_SEG1</text><text x="620" y="162" font-size="14">8 TQ（示例拆分）</text>
<text x="895" y="137" font-size="15">PHASE</text><text x="895" y="157" font-size="15">SEG2</text><text x="895" y="176" font-size="13">2 TQ</text>
</g><g stroke="#ffffff" stroke-width="1" opacity=".85"><line x1="125" y1="98" x2="125" y2="187"/><line x1="180" y1="98" x2="180" y2="187"/><line x1="235" y1="98" x2="235" y2="187"/><line x1="290" y1="98" x2="290" y2="187"/><line x1="345" y1="98" x2="345" y2="187"/><line x1="400" y1="98" x2="400" y2="187"/><line x1="455" y1="98" x2="455" y2="187"/><line x1="510" y1="98" x2="510" y2="187"/><line x1="565" y1="98" x2="565" y2="187"/><line x1="620" y1="98" x2="620" y2="187"/><line x1="675" y1="98" x2="675" y2="187"/><line x1="730" y1="98" x2="730" y2="187"/><line x1="785" y1="98" x2="785" y2="187"/><line x1="840" y1="98" x2="840" y2="187"/><line x1="895" y1="98" x2="895" y2="187"/></g><g font-size="12" fill="#51666a" text-anchor="middle"><text x="97.5" y="210">1</text><text x="152.5" y="210">2</text><text x="207.5" y="210">3</text><text x="262.5" y="210">4</text><text x="317.5" y="210">5</text><text x="372.5" y="210">6</text><text x="427.5" y="210">7</text><text x="482.5" y="210">8</text><text x="537.5" y="210">9</text><text x="592.5" y="210">10</text><text x="647.5" y="210">11</text><text x="702.5" y="210">12</text><text x="757.5" y="210">13</text><text x="812.5" y="210">14</text><text x="867.5" y="210">15</text><text x="922.5" y="210">16</text></g>
<line x1="840" y1="83" x2="840" y2="236" stroke="#c3523d" stroke-width="3"/>
<path d="M831 83 L840 91 L849 83" fill="#c3523d"/>
<text x="840" y="73" text-anchor="middle" font-size="17" font-weight="700" fill="#c3523d">采样点 87.5%</text>
<path d="M70 238 v9 H840 v-9" stroke="#198178" fill="none" stroke-width="2"/>
<text x="455" y="266" text-anchor="middle" font-size="16" font-weight="700" fill="#17786f">STM32 bxCAN：BS1 = PROP + PHASE1 = 13 TQ</text>
<text x="70" y="296" font-size="13" fill="#52666b">刻度数字表示 TQ 序号；颜色区分功能段，不表示电平。所有长度按比例绘制。</text>
</g></svg>