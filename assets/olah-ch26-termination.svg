<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc"><title id="title">典型高速CAN主干两端120欧终端</title><desc id="desc">主干两端各一只120欧终端，中间节点为短支路接入，连接器附近保护TVS，CMC如使用则靠近收发器。</desc><rect width="900" height="260" rx="18" fill="#f6faf8"/><path d="M65 74H833 M65 138H833" stroke="#218278" stroke-width="5"/><path d="M65 74v10h23v44H65v10 M833 74v10h24v44h-24v10" stroke="#bf7c42" fill="none" stroke-width="4"/><g font-family="Arial,sans-serif" font-size="20" text-anchor="middle"><text x="65" y="52">120 Ω</text><text x="833" y="52">120 Ω</text><text x="450" y="56" fill="#16746b">CAN_H</text><text x="450" y="161" fill="#16746b">CAN_L</text></g><path d="M400 138V190 M460 138V190" stroke="#517db6" stroke-width="3"/><rect x="315" y="190" width="230" height="48" rx="10" fill="#e8f0fb" stroke="#517db6" stroke-width="2"/><text x="430" y="220" text-anchor="middle" fill="#2e5685" font-size="20">短支路节点（无终端）</text><text x="605" y="219" font-size="16" fill="#526865">TVS 近连接器，CMC* 近收发器</text><text x="780" y="243" font-size="14" fill="#526865">* 可选</text></svg>