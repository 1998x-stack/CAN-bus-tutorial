<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" width="960" height="292" role="img" aria-labelledby="t d"><title id="t">bxCAN过滤器标准帧位映射</title><desc id="d">标准标识符占31到21位，IDE在位2，RTR在位1</desc><rect x="0" y="0" width="960" height="292" rx="18" fill="#f7fbf9"/><g font-family="system-ui,'PingFang SC',sans-serif" fill="#214343"><text x="37" y="42" font-size="18" font-weight="730">32 位标准帧比较键（bit 31 → bit 0）</text><rect x="35" y="83" width="450" height="86" rx="8" fill="#2c9185"/><rect x="486" y="83" width="317" height="86" fill="#dceae8"/><rect x="804" y="83" width="46" height="86" fill="#8a70c4"/><rect x="851" y="83" width="45" height="86" fill="#cf8257"/><rect x="897" y="83" width="36" height="86" rx="5" fill="#dceae8"/><text x="261" y="119" fill="white" font-size="24" text-anchor="middle">STID 11 bit</text><text x="261" y="144" fill="white" font-size="16" text-anchor="middle">bits 31..21</text><text x="645" y="119" font-size="18" text-anchor="middle">扩展字段</text><text x="645" y="145" font-size="15" text-anchor="middle">标准帧此处填 0</text><text x="827" y="115" fill="white" font-size="14" text-anchor="middle">IDE</text><text x="827" y="139" fill="white" font-size="14" text-anchor="middle">2</text><text x="874" y="115" fill="white" font-size="14" text-anchor="middle">RTR</text><text x="874" y="139" fill="white" font-size="14" text-anchor="middle">1</text><text x="50" y="218" font-size="18">标准数据帧 0x123 → Key = 0x24600000</text><text x="50" y="251" font-size="18">Mask = 0xFFE00006（ID、IDE、RTR 必须相等）</text></g></svg>
