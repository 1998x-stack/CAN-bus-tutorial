<svg viewBox="0 0 740 266" role="img" aria-labelledby="c17path-t c17path-d" xmlns="http://www.w3.org/2000/svg">
      <title id="c17path-t">两节点间需要考虑往返传播延迟</title>
      <desc id="c17path-d">左侧节点 A 和右侧节点 B 通过两线相连。上方箭头从 A 指向 B，代表输出传播；下方箭头从 B 返回 A，代表显性状态反馈。预算还包括发送和接收器件延迟。</desc>
      <rect x="28" y="63" width="135" height="130" rx="13" fill="#e3f0ec" stroke="#8cb6ab" stroke-width="2"/>
      <rect x="574" y="63" width="135" height="130" rx="13" fill="#fbece4" stroke="#d5a391" stroke-width="2"/>
      <g fill="#294443" font-size="17" text-anchor="middle" font-family="sans-serif"><text x="96" y="114" font-weight="700">节点 A</text><text x="96" y="141" font-size="13">发送/采样</text><text x="642" y="114" font-weight="700">节点 B</text><text x="642" y="141" font-size="13">总线反馈</text></g>
      <path d="M170 98H563" stroke="#cf6c4d" stroke-width="7" stroke-linecap="round"/><path d="M552 88L566 98L552 108" fill="none" stroke="#cf6c4d" stroke-width="5" stroke-linecap="round"/>
      <path d="M562 162H171" stroke="#147f80" stroke-width="7" stroke-linecap="round"/><path d="M185 151L171 162L185 173" fill="none" stroke="#147f80" stroke-width="5" stroke-linecap="round"/>
      <g font-size="15" fill="#435a58" text-anchor="middle" font-family="sans-serif"><text x="370" y="82">去程传播时间</text><text x="370" y="189">反馈传播时间</text><text x="369" y="235">采样前需要留有适当延迟和同步裕量</text></g>
    </svg>
