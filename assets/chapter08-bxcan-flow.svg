<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 306" width="960" height="306" role="img" aria-labelledby="t d"><title id="t">bxCAN发送和接收通路</title><desc id="d">CPU访问发送邮箱和接收FIFO，中间协议核心连外部收发器</desc><rect x="0" y="0" width="960" height="306" rx="18" fill="#f7fbf9"/><g font-family="system-ui,'PingFang SC',sans-serif" fill="#214343"><rect x="24" y="90" width="150" height="94" rx="13" fill="#e4f3ed" stroke="#258276" stroke-width="2"/><text x="99" y="125" text-anchor="middle" font-size="22" font-weight="750">CPU</text><text x="99" y="153" text-anchor="middle" font-size="15">APB1 寄存器</text><rect x="225" y="48" width="208" height="94" rx="13" fill="#e4f3ed" stroke="#258276" stroke-width="2"/><text x="329" y="83" text-anchor="middle" font-size="22" font-weight="750">TX 邮箱 ×3</text><text x="329" y="111" text-anchor="middle" font-size="15">标识符 / DLC / 数据</text><rect x="225" y="167" width="208" height="94" rx="13" fill="#eeeafa" stroke="#7562b2" stroke-width="2"/><text x="329" y="202" text-anchor="middle" font-size="22" font-weight="750">RX FIFO ×2</text><text x="329" y="230" text-anchor="middle" font-size="15">每个深度 3</text><rect x="500" y="90" width="196" height="105" rx="13" fill="#fff0e6" stroke="#ce7e51" stroke-width="2"/><text x="598" y="125" text-anchor="middle" font-size="22" font-weight="750">协议核心</text><text x="598" y="153" text-anchor="middle" font-size="15">仲裁 / CRC / 错误</text><rect x="755" y="90" width="182" height="105" rx="13" fill="#e2f3ee" stroke="#238275" stroke-width="2"/><text x="846" y="125" text-anchor="middle" font-size="22" font-weight="750">收发器</text><text x="846" y="153" text-anchor="middle" font-size="15">TXD / RXD</text><path d="M174 120 L225 96" fill="none" stroke="#247c74" stroke-width="4" stroke-linecap="round"/><path d="M225 212 L174 143" fill="none" stroke="#247c74" stroke-width="4" stroke-linecap="round"/><path d="M433 96 L500 120" fill="none" stroke="#247c74" stroke-width="4" stroke-linecap="round"/><path d="M500 164 L433 212" fill="none" stroke="#247c74" stroke-width="4" stroke-linecap="round"/><path d="M696 128 L755 128" fill="none" stroke="#247c74" stroke-width="4" stroke-linecap="round"/><path d="M755 168 L696 168" fill="none" stroke="#247c74" stroke-width="4" stroke-linecap="round"/><path d="M746 121L755 128L746 135" stroke="#237e75" stroke-width="3" fill="none"/><text x="480" y="291" text-anchor="middle" font-size="16">CPU 提供帧与配置；协议核心负责逐位总线操作；收发器驱动线束</text></g></svg>
