<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 355" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">标准数据、标准远程、扩展数据在相同基础标识符下的优先级</title><desc id="svg-desc">三种帧有相同的前11位基础ID；标准数据帧RTR为0，标准远程帧RTR为1、IDE为0，扩展数据帧SRR为1、IDE为1。</desc><rect x="8" y="8" width="904" height="336" rx="13" fill="#fff" stroke="#d6e7e2" stroke-width="2"/><text x="24" y="43" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="23" font-weight="700" fill="#1e5651" text-anchor="start">相同基础 ID：先比 RTR / SRR，再比 IDE</text><text x="21" y="101" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#244e4c" text-anchor="start">标准数据帧</text><rect x="243" y="73" width="205" height="53" rx="7" fill="#e4f2ed" stroke="#b8d7d0" stroke-width="2"/><text x="345.5" y="105" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#285b57" text-anchor="middle">11 位基础 ID</text><rect x="460" y="73" width="155" height="53" rx="7" fill="#bde6db" stroke="#b8d7d0" stroke-width="2"/><text x="537.5" y="105" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#285b57" text-anchor="middle">RTR = 0</text><rect x="627" y="73" width="155" height="53" rx="7" fill="#bde6db" stroke="#b8d7d0" stroke-width="2"/><text x="704.5" y="105" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#285b57" text-anchor="middle">IDE = 0</text><text x="21" y="183" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#244e4c" text-anchor="start">标准远程帧</text><rect x="243" y="155" width="205" height="53" rx="7" fill="#e4f2ed" stroke="#b8d7d0" stroke-width="2"/><text x="345.5" y="187" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#285b57" text-anchor="middle">11 位基础 ID</text><rect x="460" y="155" width="155" height="53" rx="7" fill="#fff1de" stroke="#b8d7d0" stroke-width="2"/><text x="537.5" y="187" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#285b57" text-anchor="middle">RTR = 1</text><rect x="627" y="155" width="155" height="53" rx="7" fill="#bde6db" stroke="#b8d7d0" stroke-width="2"/><text x="704.5" y="187" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#285b57" text-anchor="middle">IDE = 0</text><text x="21" y="265" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#244e4c" text-anchor="start">扩展数据帧</text><rect x="243" y="237" width="205" height="53" rx="7" fill="#e4f2ed" stroke="#b8d7d0" stroke-width="2"/><text x="345.5" y="269" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#285b57" text-anchor="middle">11 位基础 ID</text><rect x="460" y="237" width="155" height="53" rx="7" fill="#fff1de" stroke="#b8d7d0" stroke-width="2"/><text x="537.5" y="269" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#285b57" text-anchor="middle">SRR = 1</text><rect x="627" y="237" width="155" height="53" rx="7" fill="#fff1de" stroke="#b8d7d0" stroke-width="2"/><text x="704.5" y="269" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#285b57" text-anchor="middle">IDE = 1</text><text x="26" y="327" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="500" fill="#55706a" text-anchor="start">相同前缀：标准数据先胜；标准远程再胜；扩展数据继续竞争后续 18 位</text></svg>
