<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-labelledby="svg-title svg-desc"><title id="svg-title">经典 CAN 11 位标识符数据帧的字段排列</title><desc id="svg-desc">从左向右依次是SOF 1位、仲裁场12位、控制场6位、数据场0到64位、CRC场16位、ACK场2位、EOF 7位；最后是帧间最小间歇3位，不属于数据帧。下方字段宽度并非按位数比例。</desc><rect x="6" y="10" width="948" height="270" rx="10" fill="#fff" stroke="#d8e6e3" stroke-width="2"/><text x="30" y="48" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="22" fill="#1b5d59" text-anchor="start" font-weight="700">经典 CAN · 标准数据帧（CBFF）</text><rect x="20" y="77" width="65" height="112" rx="10" fill="#eef4fa" stroke="#94b9b3" stroke-width="2"/><text x="52.5" y="114" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#24464a" text-anchor="middle" font-weight="700">SOF</text><text x="52.5" y="145" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#315f61" text-anchor="middle" font-weight="500">1 bit</text><text x="52.5" y="217" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#506b6a" text-anchor="middle" font-weight="500">显性 0</text><rect x="93" y="77" width="142" height="112" rx="10" fill="#daf0ed" stroke="#94b9b3" stroke-width="2"/><text x="164" y="114" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#24464a" text-anchor="middle" font-weight="700">仲裁场</text><text x="164" y="145" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#315f61" text-anchor="middle" font-weight="500">12 bit</text><text x="164" y="217" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#506b6a" text-anchor="middle" font-weight="500">11-bit ID + RTR</text><rect x="243" y="77" width="126" height="112" rx="10" fill="#daf0ed" stroke="#94b9b3" stroke-width="2"/><text x="306" y="114" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#24464a" text-anchor="middle" font-weight="700">控制场</text><text x="306" y="145" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#315f61" text-anchor="middle" font-weight="500">6 bit</text><text x="306" y="217" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#506b6a" text-anchor="middle" font-weight="500">IDE + r0 + DLC</text><rect x="377" y="77" width="166" height="112" rx="10" fill="#fff1df" stroke="#94b9b3" stroke-width="2"/><text x="460" y="114" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#24464a" text-anchor="middle" font-weight="700">数据场</text><text x="460" y="145" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#315f61" text-anchor="middle" font-weight="500">0–64 bit</text><text x="460" y="217" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#506b6a" text-anchor="middle" font-weight="500">0–8 字节</text><rect x="551" y="77" width="121" height="112" rx="10" fill="#efe9fa" stroke="#94b9b3" stroke-width="2"/><text x="611.5" y="114" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#24464a" text-anchor="middle" font-weight="700">CRC 场</text><text x="611.5" y="145" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#315f61" text-anchor="middle" font-weight="500">16 bit</text><text x="611.5" y="217" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" fill="#506b6a" text-anchor="middle" font-weight="500">15 + 界定 1</text><rect x="680" y="77" width="90" height="112" rx="10" fill="#efe9fa" stroke="#94b9b3" stroke-width="2"/><text x="725" y="114" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#24464a" text-anchor="middle" font-weight="700">ACK 场</text><text x="725" y="145" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#315f61" text-anchor="middle" font-weight="500">2 bit</text><text x="725" y="217" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#506b6a" text-anchor="middle" font-weight="500">槽 1 + 界定 1</text><rect x="778" y="77" width="74" height="112" rx="10" fill="#eef4fa" stroke="#94b9b3" stroke-width="2"/><text x="815" y="114" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#24464a" text-anchor="middle" font-weight="700">EOF</text><text x="815" y="145" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#315f61" text-anchor="middle" font-weight="500">7 bit</text><text x="815" y="217" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#506b6a" text-anchor="middle" font-weight="500">隐性 1</text><rect x="860" y="77" width="75" height="112" rx="10" fill="#f5f6f7" stroke="#94b9b3" stroke-width="2"/><text x="897.5" y="114" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" fill="#24464a" text-anchor="middle" font-weight="700">间歇</text><text x="897.5" y="145" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="17" fill="#315f61" text-anchor="middle" font-weight="500">3 bit</text><text x="897.5" y="217" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="12.5" fill="#506b6a" text-anchor="middle" font-weight="500">不属于帧</text><text x="480" y="261" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" fill="#3b5f5d" text-anchor="middle" font-weight="500">8 字节示例：1+12+6+64+16+2+7 = 108 bit（不含动态填充位和帧间间歇）</text></svg>
