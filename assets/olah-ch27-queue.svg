<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-labelledby="title desc"><title id="title">CAN接收软件分层</title><desc id="desc">驱动中断快速读硬件FIFO并入队，协议任务检查帧并解析信号，应用层校验时效执行状态机。</desc><rect width="900" height="230" rx="18" fill="#f6faf8"/><g font-family="Arial,sans-serif" text-anchor="middle" font-size="21"><rect x="20" y="53" width="185" height="123" rx="13" fill="#dcefeb" stroke="#28867e" stroke-width="2"/><text x="112" y="97" fill="#175e5e">驱动 / ISR</text><text x="112" y="135" font-size="17">取 FIFO</text><rect x="245" y="53" width="185" height="123" rx="13" fill="#fff0df" stroke="#cc7a3c" stroke-width="2"/><text x="337" y="97" fill="#925221">有界队列</text><text x="337" y="135" font-size="17">溢出计数</text><rect x="470" y="53" width="185" height="123" rx="13" fill="#eae6fa" stroke="#7865ba" stroke-width="2"/><text x="562" y="97" fill="#59459c">协议层</text><text x="562" y="135" font-size="17">ID/DLC/解码</text><rect x="695" y="53" width="185" height="123" rx="13" fill="#e8f0fb" stroke="#517db6" stroke-width="2"/><text x="787" y="97" fill="#2e5685">应用层</text><text x="787" y="135" font-size="17">时效/状态机</text></g><g stroke="#60767a" stroke-width="3" fill="none"><path d="M208 115h31l-9 -8m9 8-9 8 M433 115h31l-9 -8m9 8-9 8 M658 115h31l-9 -8m9 8-9 8"/></g><text x="450" y="207" text-anchor="middle" fill="#526865" font-size="17">中断不做业务解析；协议不绑定具体 MCU HAL</text></svg>