name: CAN P0 accuracy and regression tests
on:
  push:
  pull_request:
jobs:
  reference-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standard-library reference tests
        run: python -m unittest discover -s tests -v
