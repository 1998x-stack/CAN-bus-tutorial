name: CAN chapters 13-15 visual QA
on:
  push:
    paths:
      - "13.html"
      - "14.html"
      - "15.html"
      - "assets/ch13-filter.svg"
      - "assets/ch14-topology.svg"
      - "assets/ch15-termination.svg"
      - "assets/olah-chapters-13-15.css"
      - "assets/olah-chapters-13-15.js"
      - "tests/browser_chapters13_15.py"
      - ".github/workflows/chapters13-15-browser.yml"
  pull_request:
    paths:
      - "13.html"
      - "14.html"
      - "15.html"
      - "assets/ch13-filter.svg"
      - "assets/ch14-topology.svg"
      - "assets/ch15-termination.svg"
      - "assets/olah-chapters-13-15.css"
      - "assets/olah-chapters-13-15.js"
      - "tests/browser_chapters13_15.py"
      - ".github/workflows/chapters13-15-browser.yml"
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Playwright
        run: |
          python -m pip install playwright==1.56.0
          command -v google-chrome
      - name: Inspect desktop, tablet, 390px and 360px mobile, print, SVG and UI
        run: python tests/browser_chapters13_15.py
      - name: Upload visual QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: can-chapters13-15-browser-qa
          path: reports/chapters13-15/
          if-no-files-found: ignore
